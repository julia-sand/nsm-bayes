[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nsm_bayes"
version = "0.1.0"
description = "NSM-Bayes experiment scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "joblib>=1.4.2,<2",
    "numpy>=1.26.4,<2",
    "omegaconf>=2.3,<3",
    "scikit-learn>=1.4.2,<2",
    "sbi>=0.23.0,<0.28",
    "scipy>=1.12.0,<2",
    "torch>=2.2.0,<3",
    "tqdm>=4.66.0,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nsm_bayes = ["config/*.yaml"]

[tool.numpydoc_validation]
# `python -m numpydoc lint $(find src/nsm_bayes -name '*.py')` checks the
# docstrings. Skipped checks are stylistic: extended summary, See Also and
# Examples are optional, and returns may be named.
checks = ["all", "ES01", "SA01", "EX01", "RT02", "SS05", "PR02", "YD01"]
exclude = ['\.__init__$']
