[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nsm-bayes"
version = "0.1.0"
description = "NSM-Bayes experiment scripts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "botorch>=0.11",  
    "gpytorch",  # direct import in inference/beta_bo_calibration.py; version pinned by botorch
    "hydra-core>=1.3.2",
    "numpy>=1.26.4",  
    "omegaconf>=2.3",
    "scikit-learn>=1.4.2",
    "sbi>=0.27,<0.28",
    "torch>=2.2.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["nsm_bayes.experiments.test_data*"]

[tool.numpydoc_validation]
# `python -m numpydoc lint $(find src/nsm_bayes -name '*.py')` checks the
# docstrings. Skipped checks are stylistic: extended summary, See Also and
# Examples are optional, and returns may be named.
checks = ["all", "ES01", "SA01", "EX01", "RT02", "SS05", "PR02", "YD01"]
exclude = ['\.__init__$']
